name: Sito vetrina

# Pubblica la cartella site/ su GitHub Pages, compresa la demo nel browser (site/provalo/demo), che NON sta nel repository:
# la costruisce questa automazione (tools/build-demo.ps1) a partire dagli stessi sorgenti del programma.
# Parte quando cambia il sito o qualcosa che finisce nella demo, oppure a mano da «Actions».
# Prima volta: in Impostazioni > Pages scegliere «Origine: GitHub Actions».
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site-src/**"
      - "Web/**"
      - "Services/**"
      - "Pages/**"
      - "Components/**"
      - "Shared/**"
      - "Models/**"
      - "wwwroot/**"
      - "i18n/**"
      - "demo/**"
      - "samples/**"
      - "App.razor"
      - "_Imports.razor"
      - "tools/build-demo.ps1"
      - "tools/build-site.ps1"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Su Windows, come la compilazione del programma: gli script sono PowerShell e i percorsi sono quelli di sempre.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Demo nel browser
        shell: powershell
        run: ./tools/build-demo.ps1
      - name: Controlli del sito
        shell: powershell
        run: ./tools/build-site.ps1 -RequireDemo
      - uses: actions/upload-artifact@v6
        with:
          name: sito
          path: site
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: sito
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
