<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.desc}}">
<link rel="canonical" href="{{canonical}}">
{{hreflangs}}
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1620" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pelago">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.desc}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{locale}}">
<meta property="og:image" content="{{base}}assets/img/og-{{lang}}.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="{{root}}assets/img/pelago-32.png">
<link rel="apple-touch-icon" href="{{root}}assets/img/pelago-180.png">
<link rel="preload" href="{{root}}assets/fonts/InstrumentSans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/style.css">
<script type="application/ld+json">{{jsonld}}</script>
{{redirect}}</head>
