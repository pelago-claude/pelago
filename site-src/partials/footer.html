<footer class="foot">
  <div class="wrap foot-grid">
    <div>
      <p>{{footer.copy}}</p>
      <p>{{footer.tm}}</p>
      <p>{{footer.privacy}}</p>
      <p>{{footer.credits}}</p>
    </div>
    <ul class="foot-links">
      <li><a href="{{repo}}">{{footer.l.code}}</a></li>
      <li><a href="{{releases}}">{{footer.l.releases}}</a></li>
      <li><a href="{{issues}}">{{footer.l.issues}}</a></li>
      <li><a href="mailto:{{email}}">{{footer.l.mail}}</a></li>
    </ul>
  </div>
</footer>
